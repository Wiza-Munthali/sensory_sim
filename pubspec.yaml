name: sensory_sim
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^3.0.7
  camera: ^0.11.2
  colorfilter_generator: ^0.0.8
  http:
  just_audio: ^0.9.30
  path_provider: ^2.1.5
  video_player: ^2.8.1
  firebase_core: ^3.15.2
  flutter_native_splash: ^2.4.6
  icons_launcher: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

icons_launcher:
  image_path: "assets/splash_screen.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

flutter_native_splash:
  image: "assets/splash_screen.png"
  color: "#EEE5F4"
  android: true
  ios: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/normal.mp3
    - assets/moderate_muffled.mp3
    - assets/severe_muffled.mp3
    - assets/tinnitus_simulation_30s.wav
